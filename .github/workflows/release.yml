name: Build & Release

on:
  push:
    tags: ["v*"]        # 推 tag(如 v1.0.0)自动打包并发布
  workflow_dispatch:    # 也可在 Actions 页面手动触发,只产出构建物

permissions:
  contents: write       # 创建 Release 并上传附件所需

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Storage tests
        run: python tests/test_storage.py

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole --name ClipVault
          --exclude-module tkinter.test --exclude-module test --exclude-module unittest
          --exclude-module doctest --exclude-module pydoc --exclude-module setuptools
          main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipVault-exe
          path: dist/ClipVault.exe
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClipVault.exe
          generate_release_notes: true
